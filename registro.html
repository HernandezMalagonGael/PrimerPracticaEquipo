<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <main class="main-container">
        <div class="form-container login-container">
            <h1>Registrar Asistencia</h1>
            <form id="form-registro" novalidate>
                <div class="form-group">
                    <input type="text" id="nombre" name="nombre" required placeholder="Nombre completo: ">
                    <span class="mensaje-alerta" id="error-nombre"></span>
                </div>
                
                <div class="form-group">
                    <input type="text" id="boleta" name="boleta" required placeholder="Boleta: ">
                    <span class="mensaje-alerta" id="error-boleta"></span>
                </div>
                
                <button type="submit" class="btn-primary">Registrar</button>
                <p class="mensaje-exito" id="mensaje-exito"></p>
            </form>
        </div>
    </main>

</body>
</html>
