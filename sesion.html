<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IniciarSesion</title>
</head>
<body>
      <main>
    <form class="formulario-sesion" id="form-sesion" novalidate>
      <h1>Iniciar sesion</h1>
      <label for="correo" ></label>
      <input type="text" id="correo" name="correo" required placeholder="correo">
      <span class="error" id="error-correo"></span>
      <label for="contraseña"></label>
      <input type="text" id="contraseña" name="contraseña" required placeholder="Contraseña">
      <span class="error" id="error-contraseña"></span>
      <button type="submit">Entrar</button>
      <p class="mensaje-exito" id="mensaje-exito"></p>
    </form>
  </main>
</body>
</html>
